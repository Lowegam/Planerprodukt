name: Build and Test

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore backend/PlanerproduktAPI/PlanerproduktAPI.slnx
    
    - name: Build
      run: dotnet build backend/PlanerproduktAPI/PlanerproduktAPI.slnx --no-restore
    
    - name: Test
      run: dotnet test backend/PlanerproduktAPI/PlanerproduktAPI.slnx --no-build