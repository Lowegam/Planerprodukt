<div style="padding:20px;">
  <h2>Zadania</h2>
  <div style="display:flex;gap:10px;margin-bottom:15px;">
    <mat-form-field><mat-label>Status</mat-label><mat-select [(ngModel)]="statusFilter" (selectionChange)="load()"><mat-option value="">Wszystkie</mat-option><mat-option value="New">Nowe</mat-option><mat-option value="InProgress">W trakcie</mat-option><mat-option value="Done">Wykonane</mat-option></mat-select></mat-form-field>
    <mat-form-field><mat-label>Priorytet</mat-label><mat-select [(ngModel)]="priorityFilter" (selectionChange)="load()"><mat-option value="">Wszystkie</mat-option><mat-option value="Low">Niski</mat-option><mat-option value="Medium">Średni</mat-option><mat-option value="High">Wysoki</mat-option></mat-select></mat-form-field>
    <mat-form-field><mat-label>Szukaj</mat-label><input matInput [(ngModel)]="searchFilter" (keyup.enter)="load()"></mat-form-field>
    <button mat-raised-button color="primary" (click)="load()">Filtruj</button>
    <button mat-raised-button color="accent" (click)="addTask()">+ Dodaj</button>
  </div>
  <table mat-table [dataSource]="tasks">
    <ng-container matColumnDef="title"><th mat-header-cell *matHeaderCellDef>Tytuł</th><td mat-cell *matCellDef="let t">{{t.title}}</td></ng-container>
    <ng-container matColumnDef="status"><th mat-header-cell *matHeaderCellDef>Status</th><td mat-cell *matCellDef="let t">{{t.status}}</td></ng-container>
    <ng-container matColumnDef="priority"><th mat-header-cell *matHeaderCellDef>Priorytet</th><td mat-cell *matCellDef="let t">{{t.priority}}</td></ng-container>
    <ng-container matColumnDef="deadline"><th mat-header-cell *matHeaderCellDef>Termin</th><td mat-cell *matCellDef="let t">{{t.deadline | date:'yyyy-MM-dd'}}</td></ng-container>
    <ng-container matColumnDef="actions"><th mat-header-cell *matHeaderCellDef>Akcje</th><td mat-cell *matCellDef="let t">
      <button mat-icon-button (click)="viewTask(t.id)"><mat-icon>visibility</mat-icon></button>
      <button mat-icon-button (click)="editTask(t.id)"><mat-icon>edit</mat-icon></button>
      <button mat-icon-button (click)="deleteTask(t.id)"><mat-icon>delete</mat-icon></button>
    </td></ng-container>
    <tr mat-header-row *matHeaderRowDef="columns"></tr><tr mat-row *matRowDef="let row; columns: columns;"></tr>
  </table>
</div>
