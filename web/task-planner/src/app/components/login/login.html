<mat-card style="max-width:400px;margin:50px auto;padding:20px;">
  <mat-card-title>Logowanie</mat-card-title>
  <mat-card-content>
    <mat-form-field style="width:100%;"><mat-label>Nazwa</mat-label><input matInput [(ngModel)]="username"></mat-form-field>
    <mat-form-field style="width:100%;"><mat-label>Hasło</mat-label><input matInput type="password" [(ngModel)]="password"></mat-form-field>
    <p style="color:red;" *ngIf="error">{{error}}</p>
    <button mat-raised-button color="primary" (click)="login()">Zaloguj</button>
    <p style="margin-top:15px;">Nie masz konta? <a routerLink="/register">Rejestracja</a></p>
  </mat-card-content>
</mat-card>
